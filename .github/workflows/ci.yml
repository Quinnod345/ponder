name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Conformance & Scope Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Verify zero-dependency invariant and lens packs
        run: |
          ./bin/ponder doctor
          ./test/conformance.sh -f deps
          ./test/conformance.sh -f smoke
          ./test/conformance.sh -f lens

      - name: Run scope-scan, diff-seeding, and SARIF/PR-comment test suite
        run: npm test

      - name: Smoke test composite GitHub Action
        uses: ./
        with:
          lens: security
          diff-ref: HEAD~1
