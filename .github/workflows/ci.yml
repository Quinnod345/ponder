name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Conformance & Scope Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Verify zero-dependency invariant and lens packs
        run: |
          ./bin/ponder doctor
          ./test/conformance.sh -f deps
          ./test/conformance.sh -f smoke
          ./test/conformance.sh -f lens

      - name: Run scope-scan, diff-seeding, and SARIF/PR-comment test suite
        run: npm test

      - name: Smoke test composite GitHub Action
        uses: ./
        with:
          lens: security
          diff-ref: HEAD~1
