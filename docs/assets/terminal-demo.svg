<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" role="img" aria-label="Ponder terminal demo: coverage gate blocking an incomplete stop, then converging with 0 deltas on pass 4">
  <style>
    .bg { fill: #0d1117; rx: 12px; stroke: #30363d; stroke-width: 1.5; }
    .bar { fill: #161b22; }
    .txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .cmd { fill: #f0f6fc; font-weight: 600; }
    .ok  { fill: #3fb950; font-weight: 600; }
    .err { fill: #f85149; font-weight: 600; }
    .wrn { fill: #d29922; font-weight: 600; }
    .acc { fill: #58a6ff; font-weight: 600; }
    .step1 { animation: fade1 12s infinite; }
    .step2 { animation: fade2 12s infinite; }
    @keyframes fade1 {
      0%, 5%   { opacity: 1; }
      45%, 95% { opacity: 1; }
      100%     { opacity: 1; }
    }
    @keyframes fade2 {
      0%, 35%  { opacity: 0.18; }
      45%, 92% { opacity: 1; }
      100%     { opacity: 0.18; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="918" height="428" rx="12" />
  <path class="bar" d="M2 13 C2 6.5 6.5 2 13 2 L907 2 C913.5 2 918 6.5 918 13 L918 38 L2 38 Z" />
  <circle cx="22" cy="20" r="6" fill="#ff5f56" />
  <circle cx="42" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="20" r="6" fill="#27c93f" />
  <text x="460" y="24" text-anchor="middle" class="txt dim">ponder - coverage gate &amp; epistemic silence</text>

  <g class="step1" transform="translate(24, 62)">
    <text x="0" y="0" class="txt cmd">$ ponder decide stop --why "Looks good"</text>
    <text x="0" y="22" class="txt err">error blocked: coverage is 0.83 - 1 of 6 modules was never graded:</text>
    <text x="0" y="42" class="txt wrn">  u-billing   src/routes/billing.js</text>
    <text x="0" y="62" class="txt dim">  blocked cannot be overridden (exit 2). Grade every unit before stopping.</text>
    <text x="0" y="84" class="txt acc">NEXT: revise - ponder delta --file deltas.jsonl</text>
  </g>

  <line x1="24" y1="168" x2="896" y2="168" stroke="#21262d" stroke-width="1" />

  <g class="step2" transform="translate(24, 196)">
    <text x="0" y="0" class="txt cmd">$ ponder judge   # pass 4 of 6 (after all 4 voices re-verify evidence on disk)</text>
    <text x="0" y="24" class="txt">  signal           value   reads as</text>
    <text x="0" y="44" class="txt">  coverage         <tspan class="ok">1.00</tspan>    6 of 6 modules graded</text>
    <text x="0" y="64" class="txt">  novelty          <tspan class="ok">0.00</tspan>    revising adds / live findings</text>
    <text x="0" y="84" class="txt">  churn            <tspan class="ok">0.00</tspan>    revising deltas / live findings</text>
    <text x="0" y="104" class="txt">  thrash           <tspan class="ok">0.00</tspan>    0 reversing deltas</text>
    <text x="0" y="124" class="txt">  voices           <tspan class="ok">4/4</tspan>     builder, dreamer, empath, skeptic</text>
    <text x="0" y="144" class="txt">  delta voices     <tspan class="ok">0/4</tspan>     no perspective emitted a delta (epistemic silence)</text>
    <text x="0" y="172" class="txt ok">  advice: stop (converged) - two consecutive quiet passes at 1.00 coverage.</text>
    <text x="0" y="196" class="txt acc">NEXT: decide - ponder decide stop --why "2 quiet passes, 1.00 coverage, 4/4 voices"</text>
  </g>
</svg>
