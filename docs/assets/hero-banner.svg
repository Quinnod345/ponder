<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect width="1200" height="500" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Header Zone -->
  <g transform="translate(48, 42)">
    <rect x="0" y="0" width="104" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#38bdf8"/>
    <text x="28" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="1">OCA LOOP</text>

    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">PONDER</text>
    <text x="192" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Convergent deliberation for coding agents — where silence is legal and skipping is impossible.</text>

    <!-- Top Pill Badges -->
    <g transform="translate(0, 84)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="198" height="26" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="12" y="17" fill="#f87171">GATE:</text>
      <text x="54" y="17" fill="#e2e8f0">coverage &lt; 1.0 = blocked</text>

      <rect x="210" y="0" width="218" height="26" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="222" y="17" fill="#34d399">CONVERGENCE:</text>
      <text x="316" y="17" fill="#e2e8f0">4 voices, 0 deltas</text>

      <rect x="440" y="0" width="214" height="26" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="452" y="17" fill="#818cf8">STATE:</text>
      <text x="500" y="17" fill="#e2e8f0">3-way verified ledger</text>

      <rect x="666" y="0" width="192" height="26" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="678" y="17" fill="#fbbf24">DEPS:</text>
      <text x="720" y="17" fill="#e2e8f0">0 npm packages</text>
    </g>
  </g>

  <!-- Left Column: Loss-Function Isomorphism (4 Perspectives = 4 Delta Ops) -->
  <g transform="translate(48, 176)">
    <rect x="0" y="0" width="536" height="284" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="22" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.8">LOSS-FUNCTION ISOMORPHISM · 4 VOICES = 4 DELTA OPS</text>

    <!-- Skeptic -->
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="496" height="48" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="10" y="11" width="84" height="26" rx="5" fill="#450a0a"/>
      <text x="52" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#fca5a5">SKEPTIC</text>
      <text x="108" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Minimise false positives</text>
      <text x="108" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Falsifies hallucinations, SQLi decoys &amp; dead code</text>
      <rect x="410" y="11" width="74" height="26" rx="5" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
      <text x="447" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#f87171">delete</text>
    </g>

    <!-- Builder -->
    <g transform="translate(20, 104)">
      <rect x="0" y="0" width="496" height="48" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="10" y="11" width="84" height="26" rx="5" fill="#082f49"/>
      <text x="52" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#7dd3fc">BUILDER</text>
      <text x="108" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Maximise shipped output</text>
      <text x="108" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Turns vague complaints into exact file:line diffs</text>
      <rect x="410" y="11" width="74" height="26" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="447" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#38bdf8">edit</text>
    </g>

    <!-- Dreamer -->
    <g transform="translate(20, 162)">
      <rect x="0" y="0" width="496" height="48" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="10" y="11" width="84" height="26" rx="5" fill="#3b0764"/>
      <text x="52" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#d8b4fe">DREAMER</text>
      <text x="108" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Maximise structural novelty</text>
      <text x="108" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Finds unrouted wizards, state dead-ends &amp; gaps</text>
      <rect x="410" y="11" width="74" height="26" rx="5" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="447" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#c084fc">add</text>
    </g>

    <!-- Empath -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="496" height="48" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="10" y="11" width="84" height="26" rx="5" fill="#064e3b"/>
      <text x="52" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#6ee7b7">EMPATH</text>
      <text x="108" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Maximise human &amp; emotional truth</text>
      <text x="108" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Steps into the user's shoes; re-ranks by lived trust</text>
      <rect x="410" y="11" width="74" height="26" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="447" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#34d399">change</text>
    </g>
  </g>

  <!-- Right Column: Epistemic Silence & Convergence Telemetry -->
  <g transform="translate(608, 176)">
    <rect x="0" y="0" width="544" height="284" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="22" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.8">TRAJECTORY · HOW EPISTEMIC SILENCE EARNS CONVERGENCE</text>

    <!-- Table Headers -->
    <g transform="translate(22, 54)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#64748b">
      <text x="0" y="0">PASS</text>
      <text x="54" y="0">COV</text>
      <text x="110" y="0">CHURN</text>
      <text x="172" y="0">SURPRISE</text>
      <text x="252" y="0">VOICES (SPOKE / DELTA)</text>
      <text x="412" y="0">VERDICT</text>
    </g>
    <line x1="22" y1="64" x2="522" y2="64" stroke="#334155" stroke-width="1"/>

    <!-- Pass 1 Row -->
    <g transform="translate(22, 90)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="6" y="0" fill="#e2e8f0" font-weight="700">01</text>
      <text x="54" y="0" fill="#f87171" font-weight="700">0.70</text>
      <text x="118" y="0" fill="#64748b">—</text>
      <text x="188" y="0" fill="#64748b">—</text>
      <text x="252" y="0" fill="#cbd5e1">4 argued · 1 delta</text>
      <rect x="404" y="-15" width="98" height="22" rx="5" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
      <text x="453" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#fca5a5">BLOCKED</text>
      <text x="54" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">3 units ungraded — engine refuses to stop (no override flag exists)</text>
    </g>

    <!-- Pass 2 Row -->
    <g transform="translate(22, 138)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="6" y="0" fill="#e2e8f0" font-weight="700">02</text>
      <text x="54" y="0" fill="#34d399" font-weight="700">1.00</text>
      <text x="110" y="0" fill="#fbbf24">0.73</text>
      <text x="176" y="0" fill="#94a3b8">0.18</text>
      <text x="252" y="0" fill="#cbd5e1">4 argued · 3 delta</text>
      <rect x="404" y="-15" width="98" height="22" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="453" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#e2e8f0">CONTINUE</text>
      <text x="54" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Skeptic kills SQLi decoy &amp; dead modal; Dreamer grades missing units</text>
    </g>

    <!-- Pass 3 Row -->
    <g transform="translate(22, 186)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="6" y="0" fill="#e2e8f0" font-weight="700">03</text>
      <text x="54" y="0" fill="#34d399" font-weight="700">1.00</text>
      <text x="110" y="0" fill="#38bdf8">0.09</text>
      <text x="176" y="0" fill="#34d399">0.00</text>
      <text x="252" y="0" fill="#cbd5e1">4 argued · 1 delta</text>
      <rect x="404" y="-15" width="98" height="22" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="453" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#7dd3fc">QUIET 1/2</text>
      <text x="54" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">3 voices verify &amp; stay silent; Builder refines 1 SQL batch query</text>
    </g>

    <!-- Pass 4 Row -->
    <g transform="translate(22, 236)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="6" y="0" fill="#34d399" font-weight="700">04</text>
      <text x="54" y="0" fill="#34d399" font-weight="700">1.00</text>
      <text x="110" y="0" fill="#34d399" font-weight="700">0.00</text>
      <text x="176" y="0" fill="#34d399" font-weight="700">0.00</text>
      <text x="252" y="0" fill="#34d399" font-weight="700">4 argued · 0 delta</text>
      <rect x="404" y="-15" width="98" height="22" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="453" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">CONVERGED</text>
      <text x="54" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6ee7b7" font-weight="600">Epistemic silence: 4 voices confirm DONE, 0 deltas emitted (Rule 6)</text>
    </g>
  </g>
</svg>
