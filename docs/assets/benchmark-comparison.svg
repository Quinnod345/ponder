<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ponderGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="370" rx="16" fill="url(#bgBench)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CONTROLLED HEAD-TO-HEAD BENCHMARK · STUDIES/HEAD-TO-HEAD-BENCHMARK</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Why unstructured multi-pass review degrades precision — and how Ponder converges to 100%</text>

  <!-- Card 1: Single-Shot -->
  <g transform="translate(40, 96)">
    <rect width="346" height="240" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">1. Single-Shot Review (1 Pass)</text>
    <text x="22" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Skims routes, misses state variants &amp; contracts</text>

    <!-- Recall Bar -->
    <text x="22" y="84" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#cbd5e1">Defect Recall (3/8 bugs)</text>
    <text x="324" y="84" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#fbbf24">37.5%</text>
    <rect x="22" y="92" width="302" height="10" rx="5" fill="#1e293b"/>
    <rect x="22" y="92" width="113" height="10" rx="5" fill="#fbbf24"/>

    <!-- Precision Bar -->
    <text x="22" y="128" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#cbd5e1">Actionable Precision (3/6)</text>
    <text x="324" y="128" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#fb923c">50.0%</text>
    <rect x="22" y="136" width="302" height="10" rx="5" fill="#1e293b"/>
    <rect x="22" y="136" width="151" height="10" rx="5" fill="#fb923c"/>

    <!-- Traps & Noise -->
    <line x1="22" y1="164" x2="324" y2="164" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="186" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#fca5a5">✗ False Positives Kept: 3</text>
    <text x="22" y="206" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#94a3b8">✗ SQLi decoy &amp; dead modal kept</text>
    <text x="22" y="226" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#94a3b8">✗ Hallucinated spinner bug on missing file</text>
  </g>

  <!-- Card 2: 4-Pass Unstructured Self-Refine -->
  <g transform="translate(427, 96)">
    <rect width="346" height="240" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#fca5a5">2. Self-Refine Loop (4 Passes)</text>
    <text x="22" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Compelled to talk on Pass 3–4 → invents noise</text>

    <!-- Recall Bar -->
    <text x="22" y="84" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#cbd5e1">Defect Recall (5/8 bugs)</text>
    <text x="324" y="84" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#fbbf24">62.5%</text>
    <rect x="22" y="92" width="302" height="10" rx="5" fill="#1e293b"/>
    <rect x="22" y="92" width="189" height="10" rx="5" fill="#fbbf24"/>

    <!-- Precision Bar -->
    <text x="22" y="128" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#cbd5e1">Actionable Precision (5/17)</text>
    <text x="324" y="128" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#f87171">29.4%</text>
    <rect x="22" y="136" width="302" height="10" rx="5" fill="#1e293b"/>
    <rect x="22" y="136" width="89" height="10" rx="5" fill="#ef4444"/>

    <!-- Traps & Noise -->
    <line x1="22" y1="164" x2="324" y2="164" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="186" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#f87171" font-weight="700">✗ False Positives Kept: 12</text>
    <text x="22" y="206" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#fca5a5">✗ 0 retractions across all 4 passes</text>
    <text x="22" y="226" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#fca5a5">✗ +9 performative nitpicks on Pass 3–4</text>
  </g>

  <!-- Card 3: 4-Pass Ponder -->
  <g transform="translate(814, 96)">
    <rect width="346" height="240" rx="12" fill="url(#ponderGlow)" stroke="#10b981" stroke-width="1.8"/>
    <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#6ee7b7">3. Ponder (4 Passes)</text>
    <text x="22" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#a7f3d0">Coverage-gated · 4 OCA voices · Epistemic silence</text>

    <!-- Recall Bar -->
    <text x="22" y="84" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#ecfdf5">Defect Recall (8/8 bugs)</text>
    <text x="324" y="84" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#34d399">100.0%</text>
    <rect x="22" y="92" width="302" height="10" rx="5" fill="#1e293b"/>
    <rect x="22" y="92" width="302" height="10" rx="5" fill="#10b981"/>

    <!-- Precision Bar -->
    <text x="22" y="128" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#ecfdf5">Actionable Precision (8/8)</text>
    <text x="324" y="128" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#34d399">100.0%</text>
    <rect x="22" y="136" width="302" height="10" rx="5" fill="#1e293b"/>
    <rect x="22" y="136" width="302" height="10" rx="5" fill="#10b981"/>

    <!-- Traps & Noise -->
    <line x1="22" y1="164" x2="324" y2="164" stroke="#065f46" stroke-width="1"/>
    <text x="22" y="186" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#6ee7b7" font-weight="700">✓ False Positives Kept: 0</text>
    <text x="22" y="206" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#a7f3d0">✓ Skeptic retracted SQLi decoy &amp; dead modal</text>
    <text x="22" y="226" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#a7f3d0">✓ Pass 4: 4 voices argued, 0 deltas (Converged)</text>
  </g>
</svg>
